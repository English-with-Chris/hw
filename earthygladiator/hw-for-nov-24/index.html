<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#070a18" />
<title>Statement Station</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%;overflow:hidden}
  body{
    background:#070a18;color:#e9efff;
    font:16px/1.45 "Trebuchet MS",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-font-smoothing:antialiased;
    user-select:none;-webkit-user-select:none;
    touch-action:manipulation;
  }
  #sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  #glow{position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(80vw 60vh at 15% -10%,rgba(90,209,255,.16),transparent 60%),
      radial-gradient(70vw 55vh at 95% 5%,rgba(167,139,250,.16),transparent 55%),
      radial-gradient(90vw 70vh at 50% 120%,rgba(120,90,255,.20),transparent 60%);
    transition:background .8s ease}
  #app{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;
    padding:calc(10px + env(safe-area-inset-top)) 14px calc(14px + env(safe-area-inset-bottom))}
  .hud{display:flex;align-items:center;justify-content:space-between;gap:8px;flex:0 0 auto}
  .hud .left{display:flex;align-items:center;gap:8px;min-width:0}
  .sector{font-size:10px;letter-spacing:.2em;color:var(--a,#5ad1ff);text-transform:uppercase;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .count{font-size:10px;letter-spacing:.12em;color:#7f8db8;white-space:nowrap}
  .icon{width:36px;height:36px;border-radius:99px;border:1px solid rgba(255,255,255,.16);
    background:rgba(255,255,255,.05);color:#cfd9f7;font-size:14px;line-height:1;flex:0 0 auto}
  .crewbar{display:flex;gap:3px;align-items:center;flex:0 0 auto;height:28px;margin-top:5px;
    overflow-x:auto;scrollbar-width:none}
  .crewbar::-webkit-scrollbar{display:none}
  .crewbar span{font-size:16px;animation:pop .35s cubic-bezier(.2,1.4,.4,1) both}
  #stage{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:11px}

  .screen{display:flex;flex-direction:column;gap:11px;animation:fade .28s ease both}
  .bubble{margin:0;text-align:center;font-size:12px;letter-spacing:.08em;color:#8395c4;
    min-height:15px}
  .kicker{margin:0;font-size:10px;letter-spacing:.24em;color:var(--a,#5ad1ff);
    text-transform:uppercase}
  h1{margin:0;font-size:clamp(28px,8.6vw,42px);letter-spacing:-.03em;line-height:1.02}

  /* home */
  .mode{appearance:none;font:inherit;text-align:left;cursor:pointer;color:#fff;
    display:flex;align-items:center;gap:13px;padding:15px;border-radius:20px;
    border:1px solid rgba(255,255,255,.16);
    background:linear-gradient(165deg,rgba(255,255,255,.11),rgba(255,255,255,.035));
    box-shadow:0 14px 36px rgba(0,0,0,.4)}
  .mode:active{transform:scale(.985)}
  .mode .mi{font-size:26px;line-height:1;flex:0 0 auto;position:relative}
  .dot{position:absolute;top:-4px;right:-6px;width:9px;height:9px;border-radius:50%;
    background:#ff8ac2;box-shadow:0 0 0 3px rgba(255,138,194,.16);
    animation:pulse 1.6s ease-in-out infinite}
  .mode .mt{display:block;font-weight:800;font-size:16.5px;letter-spacing:.01em}
  .mode .ms{display:block;font-size:11.5px;color:#a6b4dd;margin-top:2px}
  .mode .mc{margin-left:auto;font-size:10px;letter-spacing:.1em;color:#7f8db8;
    white-space:nowrap;text-align:right}
  .mode.first{border-color:rgba(90,209,255,.45)}
  .tag{display:inline-block;font-size:8.5px;letter-spacing:.16em;background:rgba(90,209,255,.2);
    color:#9fe4ff;border-radius:99px;padding:2px 7px;margin-bottom:4px;font-weight:700}
  .tiny{appearance:none;background:none;border:0;color:#5b6a99;font:inherit;
    font-size:11px;letter-spacing:.14em;padding:8px;cursor:pointer;align-self:center}

  /* cards */
  .cardwrap{position:relative}
  .card{position:relative;border-radius:22px;padding:18px 15px;text-align:center;
    background:linear-gradient(165deg,rgba(255,255,255,.11),rgba(255,255,255,.04));
    border:1px solid rgba(255,255,255,.16);
    box-shadow:0 18px 46px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.12);
    touch-action:none;will-change:transform}
  .card.mini{padding:13px}
  .card.gap{border-color:rgba(90,209,255,.4)}
  .who{font-size:25px;line-height:1;margin-bottom:7px}
  .sentence{margin:0;font-weight:600;letter-spacing:-.01em;line-height:1.35;
    font-size:clamp(17px,4.9vw,24px)}
  .slot{color:var(--a,#5ad1ff);letter-spacing:.1em}
  .sentence b{color:var(--a,#5ad1ff);font-weight:800;text-shadow:0 0 18px rgba(90,209,255,.45)}

  .doors{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .door{appearance:none;font:inherit;font-weight:700;cursor:pointer;color:#fff;
    min-height:88px;padding:12px 8px;border-radius:19px;font-size:clamp(17px,4.4vw,21px);
    display:flex;align-items:center;justify-content:center;text-align:center;
    border:1px solid rgba(255,255,255,.18);
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    transition:transform .12s ease,background .2s,border-color .2s,opacity .25s}
  .door:active{transform:scale(.955)}
  .door.lit{background:linear-gradient(180deg,rgba(90,209,255,.30),rgba(90,209,255,.10));
    border-color:var(--a,#5ad1ff)}
  .door.miss{opacity:.32;border-color:rgba(255,255,255,.07);
    background:rgba(255,255,255,.02);color:#8d99b8;cursor:default}
  .door.hint{animation:pulse 1.15s ease-in-out infinite;border-color:var(--a,#5ad1ff)}
  .card.thud{animation:thud .34s ease-out}

  /* bay */
  .banner{border-radius:20px;padding:13px 14px;text-align:center;
    border:1px solid rgba(255,255,255,.16);
    background:linear-gradient(165deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    transition:background .35s,border-color .35s}
  .banner.flip{animation:flipIn .45s cubic-bezier(.2,1.2,.4,1)}
  .banner .subj{font-weight:800;font-size:clamp(19px,5.4vw,25px);letter-spacing:-.01em}
  .banner .subj span{font-size:22px;margin-right:6px}
  .banner .ask{margin:4px 0 0;font-size:12.5px;color:#b6c4e8;letter-spacing:.02em}
  .banner .ask b{color:var(--a,#5ad1ff)}
  #chips{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  .chip{appearance:none;font:inherit;font-weight:700;cursor:pointer;color:#fff;
    min-height:58px;border-radius:15px;font-size:clamp(16px,4.6vw,20px);
    border:1px solid rgba(255,255,255,.17);
    background:linear-gradient(180deg,rgba(255,255,255,.10),rgba(255,255,255,.03));
    transition:transform .1s ease}
  .chip:active{transform:scale(.96)}
  .chip.gone{animation:gone .3s ease-in forwards;pointer-events:none}
  .chip.shake{animation:shake .32s ease-in-out}
  .pips{display:flex;gap:5px;justify-content:center;align-items:center;min-height:10px}
  .pip{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.14);
    transition:background .25s,transform .25s}
  .pip.on{background:var(--a,#5ad1ff);transform:scale(1.15)}

  .next{appearance:none;font:inherit;font-weight:800;letter-spacing:.12em;cursor:pointer;
    padding:15px;border:0;border-radius:17px;color:#06122b;
    background:linear-gradient(135deg,#5ad1ff,#a78bfa);animation:pulse 1.4s ease-in-out infinite}
  .big{appearance:none;font:inherit;font-weight:800;letter-spacing:.12em;cursor:pointer;
    padding:17px;border:0;border-radius:17px;color:#06122b;
    background:linear-gradient(135deg,#5ad1ff,#a78bfa);width:100%}

  /* слова / quizlet */
  .wordsScreen{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
    justify-content:flex-start;gap:9px}
  .scroller{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding-right:2px}
  .guide{display:flex;flex-direction:column;gap:9px}
  .step{display:flex;gap:10px;padding:11px;border-radius:16px;
    border:1px solid rgba(255,255,255,.13);
    background:linear-gradient(165deg,rgba(255,255,255,.085),rgba(255,255,255,.03));
    transition:opacity .3s,border-color .3s}
  .step.done{opacity:.55}
  .step.done .st{text-decoration:line-through;text-decoration-color:rgba(255,255,255,.35)}
  .tick{flex:0 0 auto;width:30px;height:30px;border-radius:99px;cursor:pointer;
    font:inherit;font-size:13px;font-weight:800;color:#9fb0e0;
    border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.05);
    display:flex;align-items:center;justify-content:center;padding:0}
  .tick.on{background:rgba(94,226,160,.22);border-color:#5ee2a0;color:#c9ffe4}
  .sbody{min-width:0;flex:1 1 auto}
  .st{margin:0;font-weight:800;font-size:14.5px;line-height:1.28}
  .sd{margin:3px 0 0;font-size:12.5px;color:#b8c4e4;line-height:1.4}
  .sd.warn{margin-top:4px;color:#ffd9a8}
  .lnk{display:inline-block;margin-top:7px;font-size:12px;font-weight:700;
    text-decoration:none;color:#04121f;background:linear-gradient(135deg,#5ad1ff,#a78bfa);
    border-radius:10px;padding:7px 11px;letter-spacing:.02em}
  .lnk:active{opacity:.8}
  .foot{margin:14px 0 4px;font-size:11.5px;color:#7f8db8;line-height:1.45}

  /* mini mockups */
  .mock{border:1px solid rgba(255,255,255,.12);border-radius:13px;background:#141a2e;
    padding:9px;margin-top:8px}
  .mockLabel{font-size:8.5px;letter-spacing:.14em;color:#93a2c8;margin:0 0 6px;
    text-transform:uppercase}
  .mockTile{border-radius:9px;background:#242c44;padding:11px 8px;text-align:center}
  .mockIcons{position:relative;height:21px;margin-bottom:3px}
  .mockIcons i{position:absolute;left:50%;width:19px;height:14px;border-radius:4px}
  .mockIcons i:first-child{background:#5b6ef5;transform:translate(-13px,0)}
  .mockIcons i:last-child{background:#6fd0f5;transform:translate(-4px,5px)}
  .mockTileText{font-size:11.5px;color:#dfe7fd;font-weight:700}
  .pill{display:inline-block;background:#2fb3e8;color:#04121f;border-radius:99px;
    font-size:8.5px;padding:1px 6px;margin-left:4px;font-weight:800;vertical-align:1px}
  .mockRow{display:flex;align-items:center;gap:7px;padding:7px 8px;border-radius:9px;
    background:#242c44;margin-bottom:5px;border:1px solid transparent}
  .mockRow b{flex:1 1 auto;font-size:10.5px;color:#dfe7fd;font-weight:700;line-height:1.25}
  .mockRow:last-child{margin-bottom:0}
  .mockRow.on{border-color:#4d6bf5;background:#1b2350}
  .mockStart{flex:0 0 auto;font-size:8.5px;background:#4d6bf5;color:#fff;border-radius:99px;
    padding:3px 8px;font-weight:800}
  .mockStart.ghost{background:transparent;color:#6b7ba8}
  .mockBtns{display:flex;gap:4px}
  .mockBtns span{flex:1 1 0;text-align:center;font-size:9px;padding:8px 1px;border-radius:8px;
    background:#2b3550;color:#8fa0c8;font-weight:700}
  .mockBtns span.hot{background:#1f5c40;color:#c9ffe4;box-shadow:inset 0 0 0 1px #3fbd7f}
  .mockBtns span.cold{opacity:.42}

  /* popup */
  .sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;
    background:rgba(4,7,18,.95);backdrop-filter:blur(8px);
    padding:calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom));
    animation:fade .25s ease both}
  .sheetTop{flex:0 0 auto;display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .sheetTop h2{margin:0;font-size:17px;letter-spacing:-.01em;flex:1 1 auto}
  .x{width:34px;height:34px;border-radius:99px;flex:0 0 auto;cursor:pointer;
    border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);
    color:#cfd9f7;font:inherit;font-size:14px}

  .veil{position:fixed;inset:0;z-index:30;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:13px;padding:24px;text-align:center;
    background:rgba(6,9,22,.92);backdrop-filter:blur(6px);animation:fade .3s ease both}
  .veil h2{margin:0;font-size:clamp(28px,9vw,48px);letter-spacing:-.03em}
  .veil p{margin:0;color:#a9b8dd}

  .spark{position:absolute;width:7px;height:7px;border-radius:50%;background:var(--a,#5ad1ff);
    pointer-events:none;animation:burst .6s ease-out forwards}
  .conf{position:fixed;top:-12px;width:9px;height:9px;z-index:6;border-radius:2px;
    animation:fall 1.8s linear forwards}

  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes pop{from{transform:scale(.2);opacity:0}to{transform:none;opacity:1}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.025)}}
  @keyframes thud{0%{transform:translateX(0) rotate(0)}22%{transform:translateX(8px) rotate(1.3deg)}
    52%{transform:translateX(-6px) rotate(-1deg)}100%{transform:translateX(0) rotate(0)}}
  @keyframes shake{0%,100%{transform:translateX(0)}22%{transform:translateX(-6px)}
    62%{transform:translateX(6px)}}
  @keyframes gone{to{transform:scale(.35);opacity:0}}
  @keyframes flipIn{from{transform:rotateX(70deg);opacity:.2}to{transform:none;opacity:1}}
  @keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.15);opacity:0}}
  @keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.2}}
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="glow"></div>
<div id="app">
  <div class="hud">
    <div class="left">
      <button class="icon" id="home" type="button" aria-label="back" hidden>←</button>
      <div>
        <div class="sector" id="sector">Statement Station</div>
        <div class="count" id="count"></div>
      </div>
    </div>
    <button class="icon" id="help" type="button" aria-label="help">❓</button>
    <button class="icon" id="sound" type="button" aria-label="sound">🔊</button>
  </div>
  <div class="crewbar" id="crewbar"></div>
  <main id="stage"></main>
</div>

               "at seven o'clock","in the morning","after school","on Sundays"];

var PALETTES = [

/* ================= 3. HELPERS ================= */

function rnd(n){ return Math.floor(Math.random() * n); }
function pick(a){ return a[rnd(a.length)]; }
function shuffle(a){
  a = a.slice();
  for(var i = a.length - 1; i > 0; i--){
    var j = rnd(i + 1), t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function cap(s){ return s.charAt(0).toUpperCase() + s.slice(1); }
function thirdOf(b){ return b.replace(/^(\S+)/, function(m){ return m + "s"; }); }
function esc(s){
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function collides(subject, tail){
  var sw = subject.toLowerCase().split(/\s+/);
  var tw = tail.toLowerCase().split(/\s+/).filter(function(w){ return w.length > 2; });
  return tw.some(function(w){ return sw.indexOf(w) > -1; });
}

/* ================= 4. AUDIO ================= */

var ac = null;
function actx(){
  if(!ac){ try{ ac = new (window.AudioContext || window.webkitAudioContext)(); }
           catch(e){ ac = null; } }
  return ac;
}
function blip(freq, dur, gain, type){
  if(SAVE.muted) return;
  var c = actx(); if(!c) return;
  try{
    var o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.value = freq || 600;
    g.gain.setValueAtTime(gain || 0.045, c.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + (dur || 0.09));
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + (dur || 0.09) + 0.02);
  }catch(e){}
}
function sweep(up){
  if(SAVE.muted) return;
  var c = actx(); if(!c) return;
  try{
    var o = c.createOscillator(), g = c.createGain();
    o.type = "triangle";
    var t0 = c.currentTime;
    o.frequency.setValueAtTime(up ? 220 : 700, t0);
    o.frequency.exponentialRampToValueAtTime(up ? 760 : 200, t0 + 0.22);
    g.gain.setValueAtTime(0.05, t0);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.26);
    o.connect(g); g.connect(c.destination); o.start(); o.stop(t0 + 0.28);
  }catch(e){}
}
function thudSound(){ blip(108, 0.15, 0.05, "square"); }
function fanfare(){
  [523, 659, 784, 1046].forEach(function(f, i){
    setTimeout(function(){ blip(f, 0.18, 0.05, "triangle"); }, i * 110);
  });
}
function buzz(){ try{ if(navigator.vibrate) navigator.vibrate(12); }catch(e){} }
function speak(list){
  if(SAVE.muted || !("speechSynthesis" in window)) return;
  try{ speechSynthesis.cancel(); }catch(e){}
  var i = 0;
  (function go(){
    if(i >= list.length) return;
    var u = new SpeechSynthesisUtterance(list[i++]);
    u.lang = "en-GB"; u.rate = 0.86; u.pitch = 1;
    u.onend = function(){ setTimeout(go, 180); };
    u.onerror = function(){};
    try{ speechSynthesis.speak(u); }catch(e){}
  })();
}

/* ================= 5. STARFIELD ================= */

var cv = document.getElementById("sky");
var cx = cv.getContext("2d");
var stars = [], W = 0, H = 0;

function sizeSky(){
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = W * dpr; cv.height = H * dpr;
  cx.setTransform(dpr, 0, 0, dpr, 0, 0);
  stars = [];
  var n = Math.min(140, Math.round(W * H / 11000));
  for(var i = 0; i < n; i++){
    stars.push({x:Math.random()*W, y:Math.random()*H,
      r:Math.random()*1.5+0.3, v:Math.random()*0.13+0.025,
      a:Math.random()*0.55+0.2});
  }
}
sizeSky();
window.addEventListener("resize", sizeSky);
(function loop(){
  cx.clearRect(0, 0, W, H);
  for(var i = 0; i < stars.length; i++){
    var s = stars[i];
    s.y += s.v;
    if(s.y > H + 2){ s.y = -2; s.x = Math.random() * W; }
    cx.globalAlpha = s.a; cx.fillStyle = "#cfe2ff";
    cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.283); cx.fill();
  }
  cx.globalAlpha = 1;
  requestAnimationFrame(loop);
})();

function hexA(hex, a){
  var n = parseInt(hex.slice(1), 16);
  return "rgba(" + ((n>>16)&255) + "," + ((n>>8)&255) + "," + (n&255) + "," + a + ")";

function sparks(host, n, color){
  if(!host) return;
  for(var i = 0; i < n; i++){
    var d = document.createElement("i");
    d.className = "spark";
    var ang = Math.random() * Math.PI * 2, dist = 36 + Math.random() * 80;
    d.style.left = "50%"; d.style.top = "50%";
    d.style.setProperty("--dx", Math.cos(ang) * dist + "px");
    d.style.setProperty("--dy", Math.sin(ang) * dist + "px");
    if(color) d.style.background = color;
    host.appendChild(d);
    setTimeout(function(el){ return function(){ el.remove(); }; }(d), 660);
  }
}
function confetti(){
  var cols = ["#5ad1ff","#ffd166","#ff8ac2","#5ee2a0","#a78bfa"];

    var d = document.createElement("i");

    d.style.animationDuration = (1.4 + Math.random()) + "s";

}

function wireSteps(root){
  root.addEventListener("click", function(e){
    var b = e.target.closest(".tick");
    if(!b) return;
    e.preventDefault();
    var i = +b.dataset.t;
    var k = SAVE.words.done.indexOf(i);
    if(k > -1) SAVE.words.done.splice(k, 1); else SAVE.words.done.push(i);
    save();
    var on = SAVE.words.done.indexOf(i) > -1;
    b.classList.toggle("on", on);
    b.textContent = on ? "✓" : (i + 1);
    var step = b.closest(".step");
    if(step) step.classList.toggle("done", on);
    blip(on ? 720 : 430, 0.07, 0.045);
    buzz();
    paintHud();
  }, false);
}

/* ================= 10. TWO DOORS ================= */

var recent = [];
function remember(key){
  recent.push(key);
  if(recent.length > 14) recent.shift();
}
function pickSubject(){
  if(Math.random() < 0.08) return LESSON;
  var nouns = SUBJECTS.filter(function(s){ return s.noun; });
  var pro = SUBJECTS.filter(function(s){ return !s.noun; });
  return Math.random() < 0.55 ? pick(nouns) : pick(pro);
}
function modifier(tail){
  var adv = "", marker = "";
  if(!tail.time){
    if(Math.random() < 0.30) adv = pick(ADVERBS);
    else if(Math.random() < 0.45) marker = pick(MARKERS);
  }
  return {adv:adv, marker:marker};
}
function buildRoute(){
  for(var a = 0; a < 40; a++){
    var s = pickSubject();
    var vs = VERBS.filter(function(v){ return v.k.indexOf(s.k) > -1; });
    if(!vs.length) continue;
    var v = pick(vs);
    var ts = v.tails.filter(function(t){
      return t.k.indexOf(s.k) > -1 && !collides(s.t, t.t);
    });
    if(!ts.length) continue;
    var tail = pick(ts), m = modifier(tail);
    var key = [s.t, v.b, tail.t, m.adv, m.marker].join("|");
    if(recent.indexOf(key) > -1) continue;
    remember(key);
    return {mode:"route", subject:s.t, emoji:s.e, sing:(s.n === 1),
            verb:v.b, third:thirdOf(v.b), adv:m.adv, tail:tail.t, marker:m.marker};
  }
  return {mode:"route", subject:"my sister", emoji:"👧", sing:true, verb:"read",
          third:"reads", adv:"", tail:"books", marker:""};
}
function buildTwins(){
  for(var a = 0; a < 40; a++){
    var f = pick(FAMILIES);
    var A = BY[f[0]], Bq = BY[f[1]];
    if(!A || !Bq || A.k !== Bq.k) continue;
    var vs = VERBS.filter(function(v){ return v.k.indexOf(A.k) > -1; });
    var v = pick(vs);
    var ts = v.tails.filter(function(t){
      return t.k.indexOf(A.k) > -1 &&
             !collides(A.t, t.t) && !collides(Bq.t, t.t);
    });
    if(!ts.length) continue;
    var tail = pick(ts), m = modifier(tail);
    var key = ["T", A.t, Bq.t, v.b, tail.t, m.adv, m.marker].join("|");
    if(recent.indexOf(key) > -1) continue;
    remember(key);
    var flip = Math.random() < 0.5;
    return {mode:"twins", first: flip ? Bq : A, second: flip ? A : Bq,
            verb:v.b, third:thirdOf(v.b), adv:m.adv, tail:tail.t, marker:m.marker};
  }
  return buildRoute();
}
function lineHTML(subject, adv, formOrNull, tail, marker){
  var out = [esc(cap(subject))];
  if(adv) out.push(esc(adv));
  out.push(formOrNull ? "<b>" + esc(formOrNull) + "</b>" : '<span class="slot">___</span>');
  out.push(esc(tail));
  if(marker) out.push(esc(marker));
  return out.join(" ");
}
function lineText(subject, adv, form, tail, marker){
  return [cap(subject), adv, form, tail, marker].filter(Boolean).join(" ");
}

  wirePick(forms, need, function(form){

function renderTwins(){
  var r = ROUND;
  var forms = shuffle([r.third, r.verb]);
  var formFirst = r.first.n === 1 ? r.third : r.verb;
  var need = r.second.n === 1 ? r.third : r.verb;

  stage.innerHTML =
    '<section class="screen">' +

        '<div class="card mini">' +

          '<p class="sentence">' + lineHTML(r.first.t, r.adv, formFirst, r.tail, r.marker) + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="cardwrap" id="wrap">' +
        '<div class="card mini gap" id="card">' +
          '<div class="who">' + r.second.e + '</div>' +
          '<p class="sentence">' + lineHTML(r.second.t, r.adv, null, r.tail, r.marker) + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="doors" id="doors">' +
        forms.map(function(f, i){
          return '<button class="door" type="button" data-i="' + i + '">' + esc(f) + '</button>';
        }).join("") +
      '</div>' +
    '</section>';

  wirePick(forms, need, function(form){
    finishTwins(form, formFirst);
  });
}

function wirePick(forms, correct, onPick){
  var wrap = document.getElementById("wrap");
  var card = document.getElementById("card");
  var doors = document.getElementById("doors");
  var radio = document.getElementById("radio");
  var locked = false;

  function thunk(){
    card.style.transition = "transform .16s ease-out";
    card.style.transform = "translateX(0) rotate(0)";
    later(function(){
      card.classList.remove("thud");
      void card.offsetWidth;
      card.classList.add("thud");
      thudSound();
    }, 110);
  }
  function miss(idx){
    var btn = doors.children[idx];
    if(btn){
      if(btn.disabled){ thunk(); return; }
      btn.classList.add("miss");
      btn.disabled = true;
    }
    for(var i = 0; i < doors.children.length; i++){
      if(i !== idx) doors.children[i].classList.add("hint");
    }
    if(radio) radio.textContent = "That handle is shut. Try the other one.";
    buzz(); thunk();
  }
  function commit(idx){
    if(locked) return;
    var form = forms[idx];
    if(form !== correct) return miss(idx);

    locked = true;
    var btn = doors.children[idx];
    if(btn) btn.classList.add("lit");
    sweep(true); buzz();
    card.classList.remove("thud");
    card.style.transition = "transform .28s cubic-bezier(.4,0,1,1), opacity .28s ease-in";
    card.style.transform = "translateX(" + (idx === 0 ? -420 : 420) + "px) rotate(" +
      (idx === 0 ? -13 : 13) + "deg)";
    card.style.opacity = "0";
    sparks(wrap, 14);
    later(function(){ onPick(form, idx); }, 290);
  }

  doors.addEventListener("click", function(e){
    var b = e.target.closest(".door");
    if(!b) return;
    commit(+b.dataset.i);
  });

  var sx = 0, dx = 0, active = false;
  card.addEventListener("pointerdown", function(e){
    if(locked) return;
    active = true; sx = e.clientX; dx = 0;
    card.style.transition = "none";
    try{ card.setPointerCapture(e.pointerId); }catch(err){}
  });
  card.addEventListener("pointermove", function(e){
    if(!active || locked) return;
    dx = e.clientX - sx;
    card.style.transform = "translateX(" + (dx * 0.8) + "px) rotate(" + (dx * 0.03) + "deg)";
  });
  function release(){
    if(!active) return;
    active = false;
    card.style.transition = "transform .26s cubic-bezier(.2,.9,.3,1.3)";
    if(dx < -62) return commit(0);
    if(dx > 62) return commit(1);
    card.style.transform = "translateX(0) rotate(0)";
  }
  card.addEventListener("pointerup", release);
  card.addEventListener("pointercancel", release);
}

function finishRoute(form, text){
  var r = ROUND;
  stage.innerHTML =
    '<section class="screen">' +
      '<p class="bubble">Delivered.</p>' +
      '<div class="cardwrap">' +
        '<div class="card">' +
          '<div class="who">' + r.emoji + '</div>' +
          '<p class="sentence">' + lineHTML(r.subject, r.adv, form, r.tail, r.marker) + '</p>' +
        '</div>' +
      '</div>' +
      '<button class="next" id="next" type="button">NEXT ➜</button>' +
    '</section>';

  blip(880, 0.12, 0.05, "triangle");
  speak([text]);
  document.getElementById("next").addEventListener("click", function(){
    blip(720, 0.07); deliverDoors([r.subject]);
  });
  later(function(){ if(!sheetOpen) deliverDoors([r.subject]); }, 6000);
}

function finishTwins(form, formFirst){
  var r = ROUND;
  var a = lineText(r.first.t, r.adv, formFirst, r.tail, r.marker);
  var b = lineText(r.second.t, r.adv, form, r.tail, r.marker);

  stage.innerHTML =
    '<section class="screen">' +
      '<p class="bubble">Both crates. Both doors.</p>' +
      '<div class="cardwrap">' +
        '<div class="card mini">' +
          '<div class="who">' + r.first.e + '</div>' +
          '<p class="sentence">' + lineHTML(r.first.t, r.adv, formFirst, r.tail, r.marker) + '</p>' +
        '</div>' +
      '</div>' +
      '<div class="cardwrap">' +
        '<div class="card mini gap">' +
          '<div class="who">' + r.second.e + '</div>' +
          '<p class="sentence">' + lineHTML(r.second.t, r.adv, form, r.tail, r.marker) + '</p>' +
        '</div>' +
      '</div>' +
      '<button class="next" id="next" type="button">NEXT ➜</button>' +
    '</section>';

  blip(880, 0.12, 0.05, "triangle");
  speak([a, b]);

  var subs = [r.first.t, r.second.t];
  document.getElementById("next").addEventListener("click", function(){
    blip(720, 0.07); deliverDoors(subs);
  });
  later(function(){ if(!sheetOpen) deliverDoors(subs); }, 7000);
}

function deliverDoors(subjects){
  clearTimers();
  var wasLevel = level();
  SAVE.doors.delivered++;
  subjects.forEach(function(t){
    if(SAVE.doors.crew.indexOf(t) === -1) SAVE.doors.crew.push(t);
  });
  save(); paintHud();
  if(level() > wasLevel){
    paintPalette();
    later(function(){ levelUp(false); }, 260);
  }else{
    nextRound();
  }
}

/* ================= 11. SORTING BAY ================= */

var B = {round:null, flipped:false, got:0};

function bayRound(){
  var switchy = SAVE.bay.delivered >= 2 && Math.random() < 0.5;
  for(var a = 0; a < 40; a++){
    var f = pick(FAMILIES);
    var A = BY[f[0]], Bq = BY[f[1]];
    if(!A || !Bq || A.k !== Bq.k) continue;

    var pool = shuffle(VERBS.filter(function(v){ return v.k.indexOf(A.k) > -1; }));
    if(pool.length < 4) continue;
    var bases = pool.slice(0, 4);

    var chips = [];
    bases.forEach(function(v, i){
      chips.push({id: i + "s", form:"s", text: thirdOf(v.b)});
      chips.push({id: i + "b", form:"bare", text: v.b});
    });
    chips = shuffle(chips);

    var start = Math.random() < 0.5 ? A : Bq;
    return {a:A, b:Bq, start:start, now:start, chips:chips,
            switchy:switchy, flipAt: switchy ? 2 : -1};
  }
  return null;
}

function nextBay(){
  clearTimers();
  B = {round: bayRound(), flipped:false, got:0};
  paintHud(); paintPalette();
  if(!B.round){ renderHome(); return; }
  renderBay();
}
function bayNeed(){ return B.round.now.n === 1 ? "s" : "bare"; }
function bayRemaining(){
  var need = bayNeed();
  return B.round.chips.filter(function(c){ return !c.gone && c.form === need; }).length;
}
function pipsHTML(){
  var out = "";
  for(var i = 0; i < 4; i++) out += '<i class="pip' + (i < B.got ? " on" : "") + '"></i>';
  return out;
}

function renderBay(){
  var r = B.round;
  var subj = r.now;
  var need = bayNeed();
  var ask = need === "s"
    ? "tap every verb with <b>−s</b>"
    : "tap every verb <b>without −s</b>";

  stage.innerHTML =
    '<section class="screen">' +
      '<p class="bubble" id="radio">' +
        (r.switchy ? "Watch the beacon." : "One subject. Eight verbs.") + '</p>' +
      '<div class="banner" id="banner">' +
        '<div class="subj"><span>' + subj.e + '</span>' + esc(cap(subj.t)) + '</div>' +
        '<p class="ask">' + ask + '</p>' +
      '</div>' +
      '<div id="chips">' +
        r.chips.map(function(c, i){
          return '<button class="chip" type="button" data-i="' + i + '"' +
                 (c.gone ? ' style="visibility:hidden"' : '') + '>' +
                 esc(c.text) + '</button>';
        }).join("") +
      '</div>' +
      '<div class="pips" id="pips">' + pipsHTML() + '</div>' +
    '</section>';

  document.getElementById("chips").addEventListener("click", onChip);
}

function onChip(e){
  var btn = e.target.closest(".chip");
  if(!btn) return;
  var idx = +btn.dataset.i;
  var chip = B.round.chips[idx];
  if(!chip || chip.gone) return;

  if(chip.form !== bayNeed()) return bayMiss(btn);

  chip.gone = true;
  btn.classList.add("gone");
  btn.disabled = true;
  B.got++;
  blip(520 + Math.min(B.got, 4) * 90, 0.1, 0.05, "triangle");
  buzz();
  var pips = document.getElementById("pips");
  if(pips) pips.innerHTML = pipsHTML();
  var radio = document.getElementById("radio");
  if(radio) radio.textContent = pick(["Clean.","In the crate.","Yes.","One more.","Nice."]);

  if(B.round.switchy && !B.flipped && B.got >= B.round.flipAt) return bayFlip();
  if(bayRemaining() === 0) return bayComplete();
}

function bayMiss(btn){
  btn.classList.remove("shake");
  void btn.offsetWidth;
  btn.classList.add("shake");
  thudSound(); buzz();
  var radio = document.getElementById("radio");
  if(radio) radio.textContent = "That one is not for " + B.round.now.t + ". Try another.";
}

function bayFlip(){
  B.flipped = true;
  var r = B.round;
  r.now = (r.now === r.a) ? r.b : r.a;
  blip(300, 0.18, 0.05, "sawtooth");
  sweep(true); buzz();
  renderBay();
  var radio = document.getElementById("radio");
  if(radio) radio.textContent = "The beacon changed!";
  var banner = document.getElementById("banner");
  if(banner){
    banner.classList.remove("flip");
    void banner.offsetWidth;
    banner.classList.add("flip");
  }
  if(bayRemaining() === 0) bayComplete();
}

function bayComplete(){
  clearTimers();
  fanfare(); confetti();
  var wasLevel = level();
  SAVE.bay.delivered++;
  var subj = B.round.now.t;
  if(SAVE.bay.crew.indexOf(subj) === -1) SAVE.bay.crew.push(subj);
  save(); paintHud();
  var radio = document.getElementById("radio");
  if(radio) radio.textContent = "Crate away.";

  if(level() > wasLevel){
    paintPalette();
    later(function(){ levelUp(true); }, 500);
  }else{
    later(function(){ nextBay(); }, 700);
  }
}

/* ================= 12. LEVEL UP ================= */

function levelUp(isBay){
  var veil = document.createElement("div");
  veil.className = "veil";
  veil.innerHTML =
    "<h2>Sector " + level() + "</h2>" +
    "<p>New lights. Same rule.</p>" +
    '<button class="big" id="go" type="button" style="max-width:250px">GO</button>';
  document.body.appendChild(veil);
  fanfare(); confetti(); buzz();
  veil.querySelector("#go").addEventListener("click", function(){
    veil.remove();
    if(isBay) nextBay(); else nextRound();
  });
}

/* ================= 13. BOOT ================= */

document.getElementById("sound").addEventListener("click", function(){
  SAVE.muted = !SAVE.muted;
  save();
  this.textContent = SAVE.muted ? "🔇" : "🔊";
  if(SAVE.muted && "speechSynthesis" in window){
    try{ speechSynthesis.cancel(); }catch(e){}
  }else{
    blip(700, 0.08);
  }
});

load();
paintPalette();
document.getElementById("sound").textContent = SAVE.muted ? "🔇" : "🔊";
renderHome();

})();
</script>
